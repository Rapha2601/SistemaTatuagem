
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Estúdio de Tatuagem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      background: #1c1c1c;
      border: 1px solid #383838;
      border-radius: 14px;
      box-shadow: 0 10px 35px #0008;
    }

    .login-box h1 {
      margin-bottom: 8px;
      color: #d4af37;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
    }

    .login-box p {
      margin-bottom: 30px;
      color: #aaa;
      text-align: center;
    }

    .form-control {
      padding: 13px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #292929;
      color: #fff;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .form-control:focus {
      border-color: #d4af37;
      background: #292929;
      color: #fff;
      box-shadow: 0 0 0 0.2rem #d4af3733;
    }

    .btn-login {
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #d4af37;
      color: #111;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #f0cc58;
      color: #111;
    }

    .voltar {
      display: block;
      margin-top: 22px;
      color: #d4af37;
      text-align: center;
      text-decoration: none;
    }

    .voltar:hover {
      color: #f0cc58;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="login-box">
    <h1>Estúdio de Tatuagem</h1>
    <p>Entre na sua conta para continuar</p>

    <form id="form-login">
      <div class="mb-3">
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="E-mail"
          autocomplete="username"
          required
        >
      </div>

      <div class="mb-4">
        <input
          type="password"
          id="senha"
          class="form-control"
          placeholder="Senha"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-login w-100">
        Entrar
      </button>
    </form>

    <a href="index.html" class="voltar">Voltar para o início</a>
  </main>

  <script src="js/login.js"></script>

</body>
</html>
