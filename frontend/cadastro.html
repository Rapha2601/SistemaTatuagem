
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Estúdio de Tatuagem</title>

  <style>
    :root {
      --preto: #111111;
      --fundo: #191919;
      --cinza: #242424;
      --cinza-claro: #bdbdbd;
      --dourado: #d4af37;
      --dourado-hover: #f0cc52;
      --borda: #383838;
      --branco: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #302814 0%, var(--preto) 48%);
      color: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
    }

    .cadastro-container {
      width: 100%;
      max-width: 440px;
      padding: 38px;
      background: var(--fundo);
      border: 1px solid var(--borda);
      border-top: 4px solid var(--dourado);
      border-radius: 14px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
    }

    .logo {
      margin-bottom: 8px;
      color: var(--dourado);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 4px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--branco);
      font-size: 29px;
      text-align: center;
    }

    .subtitulo {
      margin: 0 0 30px;
      color: var(--cinza-claro);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      color: var(--cinza-claro);
      font-size: 13px;
      font-weight: bold;
    }

    .form-control {
      width: 100%;
      padding: 13px 14px;
      background: var(--cinza);
      color: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 7px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control::placeholder {
      color: #858585;
    }

    .form-control:focus {
      background: var(--cinza);
      color: var(--branco);
      border-color: var(--dourado);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    .btn-cadastrar {
      width: 100%;
      margin-top: 5px;
      padding: 13px;
      background: var(--dourado);
      color: var(--preto);
      border: 1px solid var(--dourado);
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-cadastrar:hover {
      background: var(--dourado-hover);
      transform: translateY(-1px);
    }

    .rodape {
      margin: 25px 0 0;
      color: var(--cinza-claro);
      font-size: 14px;
      text-align: center;
    }

    .rodape a {
      color: var(--dourado);
      font-weight: bold;
      text-decoration: none;
    }

    .rodape a:hover {
      color: var(--dourado-hover);
      text-decoration: underline;
    }

    .voltar {
      display: block;
      margin-top: 22px;
      color: #858585;
      font-size: 12px;
      text-align: center;
      text-decoration: none;
    }

    .voltar:hover {
      color: var(--dourado);
    }

    @media (max-width: 480px) {
      .cadastro-container {
        padding: 28px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="cadastro-container">
    <div class="logo">ST. TATTOO</div>

    <h1>Criar conta</h1>

    <p class="subtitulo">
      Faça seu cadastro para acessar o sistema do estúdio.
    </p>

    <form id="form-cadastro">

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          class="form-control"
          placeholder="Digite seu nome"
          required
        >
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="Digite seu e-mail"
          required
        >
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          class="form-control"
          placeholder="Crie uma senha"
          required
        >
      </div>

      <button type="submit" class="btn-cadastrar">
        Cadastrar
      </button>

    </form>

    <p class="rodape">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>

    <a href="index.html" class="voltar">
      ← Voltar para a página inicial
    </a>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
