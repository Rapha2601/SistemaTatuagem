
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estilos — Estúdio de Tatuagem</title>

  <style>
    :root {
      --preto: #111111;
      --fundo: #191919;
      --cinza: #242424;
      --cinza-claro: #bdbdbd;
      --dourado: #d4af37;
      --dourado-hover: #f0cc52;
      --borda: #383838;
      --branco: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background: var(--preto);
      color: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
      background: var(--fundo);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 16px 22px;
      margin-bottom: 35px;
    }

    .navbar .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
    }

    .navbar-brand {
      color: var(--dourado);
      font-size: 21px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
    }

    .nav-links a {
      color: var(--cinza-claro);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--dourado);
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .btn-sair {
      background: transparent;
      color: var(--dourado);
      border: 1px solid var(--dourado);
      border-radius: 6px;
      padding: 9px 16px;
      transition: 0.2s;
    }

    .btn-sair:hover {
      background: var(--dourado);
      color: var(--preto);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: var(--dourado);
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: var(--cinza-claro);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .form-card {
      background: var(--fundo);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .form-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      color: var(--branco);
    }

    .form-estilo {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 12px;
    }

    .form-estilo input {
      flex: 1;
      min-width: 220px;
      padding: 13px 14px;
      background: var(--cinza);
      color: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 6px;
      outline: none;
    }

    .form-estilo input:focus {
      border-color: var(--dourado);
      box-shadow: 0 0 0 2px #d4af3725;
    }

    .form-estilo input::placeholder {
      color: #999999;
    }

    .btn-primary {
      background: var(--dourado);
      color: var(--preto);
      border: 1px solid var(--dourado);
      border-radius: 6px;
      padding: 12px 24px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: var(--dourado-hover);
      border-color: var(--dourado-hover);
    }

    .table-card {
      background: var(--fundo);
      border: 1px solid var(--borda);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--borda);
    }

    .table-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--cinza);
    }

    th, td {
      padding: 15px 20px;
      text-align: left;
      border-bottom: 1px solid var(--borda);
    }

    th {
      color: var(--dourado);
      font-weight: bold;
    }

    td {
      color: var(--cinza-claro);
    }

    tbody tr:hover {
      background: #ffffff08;
    }

    tbody tr:last-child td {
      border-bottom: none;
      
/* Botões Editar e Excluir da tabela */
#corpo-tabela button,
#corpo-tabela a,
#corpo-tabela input[type="button"],
#corpo-tabela input[type="submit"] {
  display: inline-block;
  background-color: transparent !important;
  color: #d4af37 !important;
  border: 1px solid #d4af37 !important;
  border-radius: 6px;
  padding: 7px 12px;
  margin: 3px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.2s, color 0.2s;
}

#corpo-tabela button:hover,
#corpo-tabela a:hover,
#corpo-tabela input[type="button"]:hover,
#corpo-tabela input[type="submit"]:hover {
  background-color: #d4af37 !important;
  color: #111111 !important;
}

/* Excluir: destaque vermelho */
#corpo-tabela .btn-danger,
#corpo-tabela .btn-excluir,
#corpo-tabela .excluir {
  color: #ff6262 !important;
  border-color: #dc3545 !important;
}

#corpo-tabela .btn-danger:hover,
#corpo-tabela .btn-excluir:hover,
#corpo-tabela .excluir:hover {
  background-color: #dc3545 !important;
  color: #ffffff !important;
}

    }

    @media (max-width: 850px) {
      body {
        padding: 15px;
      }

      .navbar .container {
        align-items: flex-start;
      }

      .nav-links {
        gap: 12px;
      }

      h1 {
        font-size: 27px;
      }
    }

    @media (max-width: 500px) {
      .nav-links {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-estilo {
        flex-direction: column;
      }

      .form-estilo input {
        min-width: 0;
        width: 100%;
      }

      .form-estilo button {
        width: 100%;
      }

      th, td {
        padding: 12px;
      }
    }


#corpo-tabela .btn-warning {
  background: transparent !important;
  color: #d4af37 !important;
  border: 1px solid #d4af37 !important;
  border-radius: 6px;
  padding: 7px 14px;
  font-weight: bold;
  cursor: pointer;
}

#corpo-tabela .btn-warning:hover {
  background: #d4af37 !important;
  color: #111111 !important;
}

#corpo-tabela .btn-danger {
  background: transparent !important;
  color: #ff6262 !important;
  border: 1px solid #dc3545 !important;
  border-radius: 6px;
  padding: 7px 14px;
  font-weight: bold;
  cursor: pointer;
}

#corpo-tabela .btn-danger:hover {
  background: #dc3545 !important;
  color: #ffffff !important;
}

  </style>
</head>

<body>

  <header class="navbar">
    <div class="container">
      <a href="dashboard.html" class="navbar-brand">ST. TATTOO</a>

      <nav class="nav-links" aria-label="Navegação principal">
        <a href="clientes.html">Clientes</a>
        <a href="senioridade.html">Senioridade</a>
        <a href="estilos.html">Estilos</a>
        <a href="tatuadores.html">Tatuadores</a>
        <a href="agendamentos.html">Agendamentos</a>
        <button type="button" onclick="sair()" class="btn-sair">Sair</button>
      </nav>
    </div>
  </header>

  <main>
    <h1>Estilos de tatuagem</h1>
    <p class="subtitulo">
      Cadastre, consulte e gerencie os estilos disponíveis no estúdio.
    </p>

    <section class="form-card">
      <h2>Cadastrar novo estilo</h2>

      <form id="form-estilo" class="form-estilo">
        <input
          type="text"
          id="descricao"
          placeholder="Descrição (ex: Blackwork)"
          required
        >

        <button
          id="btn-submit-estilo"
          type="submit"
          class="btn-primary"
        >
          Cadastrar estilo
        </button>
      </form>
    </section>

    <section class="table-card">
      <div class="table-header">
        <h2>Estilos cadastrados</h2>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="corpo-tabela">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/estilos.js"></script>

</body>
</html>
