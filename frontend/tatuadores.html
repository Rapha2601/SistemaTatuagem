
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatuadores — Estúdio de Tatuagem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #1c1c1c !important;
      border-bottom: 1px solid #383838;
    }

    .navbar-brand {
      color: #d4af37 !important;
      font-weight: bold;
    }

    .navbar a {
      text-decoration: none;
    }

    h1, h2 {
      color: #d4af37;
      font-weight: bold;
    }

    .card-painel {
      padding: 25px;
      margin-bottom: 30px;
      background: #1c1c1c;
      border: 1px solid #383838;
      border-radius: 12px;
    }

    .form-control,
    .form-select {
      background-color: #242424;
      color: #eee;
      border: 1px solid #444;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #242424;
      color: #fff;
      border-color: #d4af37;
      box-shadow: 0 0 0 0.2rem #d4af3733;
    }

    .form-select option {
      background: #242424;
      color: #eee;
    }

    label {
      color: #ddd;
    }

    #listaEstilos {
      padding: 12px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 8px;
    }

    #listaEstilos label {
      margin-right: 14px;
      margin-bottom: 8px;
    }

    input[type="checkbox"] {
      accent-color: #d4af37;
    }

    .btn-primary,
    .btn-success {
      background: #d4af37;
      border-color: #d4af37;
      color: #111;
      font-weight: bold;
    }

    .btn-primary:hover,
    .btn-success:hover {
      background: #f0cc58;
      border-color: #f0cc58;
      color: #111;
    }

    .btn-secondary {
      background: #333;
      border-color: #555;
      color: #eee;
    }

    .btn-outline-light:hover {
      background: #d4af37;
      border-color: #d4af37;
      color: #111;
    }

    .table {
      --bs-table-bg: #1c1c1c;
      --bs-table-color: #eee;
      --bs-table-border-color: #444;
      --bs-table-hover-bg: #292929;
      --bs-table-hover-color: #fff;
      vertical-align: middle;
    }

    .table th {
      color: #d4af37;
    }

    .table td {
      color: #eee;
    }

    @media (max-width: 768px) {
      .navbar .container {
        gap: 12px;
      }

      .navbar .container > div {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .table {
        font-size: 13px;
      }

      .card-painel {
        padding: 16px;
      }
    }

.navbar a,
.navbar a:visited {
  color: #bdbdbd;
  text-decoration: none;
}

.navbar a:hover {
  color: #d4af37;
}

  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a>

      <div class="d-flex flex-wrap gap-3 align-items-center">
        <a href="clientes.html">Clientes</a>
        <a href="senioridade.html">Senioridade</a>
        <a href="tatuadores.html">Tatuadores</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="estilos.html">Estilos</a>
        <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-3">

    <h1 class="mb-4">Tatuadores</h1>

    <section class="card-painel">
      <h2 class="h4 mb-4">Cadastrar tatuador</h2>

      <form id="form-tatuador">
        <div class="row g-3">

          <div class="col-md-6">
            <label for="nometatuador" class="form-label">Nome</label>
            <input type="text" id="nometatuador" class="form-control" placeholder="Nome completo" required>
          </div>

          <div class="col-md-6">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" id="cpf" class="form-control" placeholder="CPF" required>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" class="form-control" placeholder="E-mail" required>
          </div>

          <div class="col-md-6">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" id="telefone" class="form-control" placeholder="Telefone" required>
          </div>

          <div class="col-md-6">
            <label for="idsenioridade" class="form-label">Senioridade</label>
            <select id="idsenioridade" class="form-select" required>
              <option value="">Selecione a senioridade</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">Estilos de tatuagem</label>
            <div id="listaEstilos">
              <!-- O JavaScript carrega os estilos aqui -->
            </div>
          </div>

          <div class="col-12">
            <button type="submit" id="btn-submit-tatuador" class="btn btn-primary w-100">
              Salvar tatuador
            </button>
          </div>

        </div>
      </form>
    </section>

    <section class="card-painel">
      <h2 class="h4 mb-4">Tatuadores cadastrados</h2>

      <div class="table-responsive">
        <table class="table table-dark table-hover table-bordered">
          <thead>
            <tr>
              <th>Tatuadores</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
